<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケモン ツール集</title>
<style>
:root{--bg:#f2f3f7;--fg:#1f2330;--card:#fff;--bd:#e1e4ec;--sub:#6b7185;--ac:#ee4036;--ac2:#ff7a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--fg:#eceef5;--card:#1d2029;--bd:#2c303c;--sub:#9aa1b5}}
:root[data-theme="dark"]{--bg:#12141b;--fg:#eceef5;--card:#1d2029;--bd:#2c303c;--sub:#9aa1b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:36px 16px 40px}
h1{margin:0;font-size:28px;font-weight:800;text-align:center;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{text-align:center;color:var(--sub);font-size:14px;margin:8px 0 28px}
a.card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-top:14px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .15s}
a.card:active{transform:scale(.98)}
.ic{flex:none;width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.tx b{font-size:18px;display:block}
.tx span{font-size:13px;color:var(--sub);line-height:1.5}
.ar{margin-left:auto;color:var(--sub);font-size:22px}
footer{margin-top:36px;font-size:11px;line-height:1.7;color:var(--sub);text-align:center}
</style></head><body><main>
<h1>ポケモン ツール集</h1>
<p class="lead">遊びたいもの・使いたいものを選んでね</p>
<a class="card" href="https://kouta121.github.io/damage-calc/">
 <div class="ic">⚔️</div><div class="tx"><b>ダメ計</b><span>実数値を入れると、ダメージの範囲と確定数がわかる</span></div><div class="ar">›</div></a>
<a class="card" href="https://kouta121.github.io/damage-calc/pokegesser/">
 <div class="ic">🎯</div><div class="tx"><b>ポケゲッサー</b><span>ヒントをもとにポケモンを当てるゲーム(10回まで)</span></div><div class="ar">›</div></a>
<a class="card" href="https://kouta121.github.io/damage-calc/statguess/">
 <div class="ic">📊</div><div class="tx"><b>種族値あて</b><span>6つの種族値を比べて、ポケモンを当てるゲーム</span></div><div class="ar">›</div></a>
<a class="card" href="https://kouta121.github.io/damage-calc/wordle/">
 <div class="ic">🔤</div><div class="tx"><b>ポケワードル</b><span>ポケモンの名前を当てるワードル。答えを避ける「いじわるモード」つき</span></div><div class="ar">›</div></a>
<footer>非公式のファンサイトです。ポケモンおよび関連する名称は、任天堂・クリーチャーズ・ゲームフリークの商標または登録商標です。非営利で運営しており、公式とは関係ありません。ポケモンのデータにはPokéAPIを利用しています。</footer>
</main></body></html>
